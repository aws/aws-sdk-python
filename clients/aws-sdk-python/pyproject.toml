[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/aws_sdk_python/__init__.py"

[tool.hatch.build]
exclude = [
    "tests",
]

[tool.ruff]
src = ["src"]
