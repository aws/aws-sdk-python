[project]
name = "aws-sdk-python"
dynamic = ["version"]
description = "Meta-package containing all AWS service clients."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Amazon Web Services"},
]
keywords = ["smithy", "aws_sdk", "aws_sdk_python", "aws"]
license = {text = "Apache License 2.0"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
"Code" = "https://github.com/aws/aws-sdk-python/tree/develop/clients/aws-sdk-python/"
"Issue tracker" = "https://github.com/aws/aws-sdk-python/issues"

[project.optional-dependencies]
acm = ["aws_sdk_acm~=0.12.0"]
api_gateway = ["aws_sdk_api_gateway~=0.12.0"]
appconfigdata = ["aws_sdk_appconfigdata~=0.12.0"]
bedrock = ["aws_sdk_bedrock~=0.12.0"]
bedrock_agent = ["aws_sdk_bedrock_agent~=0.12.0"]
bedrock_agent_runtime = ["aws_sdk_bedrock_agent_runtime~=0.12.0"]
bedrock_agentcore = ["aws_sdk_bedrock_agentcore~=0.12.0"]
bedrock_agentcore_control = ["aws_sdk_bedrock_agentcore_control~=0.12.0"]
bedrock_data_automation = ["aws_sdk_bedrock_data_automation~=0.12.0"]
bedrock_data_automation_runtime = ["aws_sdk_bedrock_data_automation_runtime~=0.12.0"]
bedrock_runtime = ["aws_sdk_bedrock_runtime~=0.12.0"]
cloudformation = ["aws_sdk_cloudformation~=0.12.0"]
cloudfront = ["aws_sdk_cloudfront~=0.12.0"]
cloudfront_keyvaluestore = ["aws_sdk_cloudfront_keyvaluestore~=0.12.0"]
cloudtrail = ["aws_sdk_cloudtrail~=0.12.0"]
cognito_identity = ["aws_sdk_cognito_identity~=0.12.0"]
connecthealth = ["aws_sdk_connecthealth~=0.12.0"]
dynamodb = ["aws_sdk_dynamodb~=0.12.0"]
ec2 = ["aws_sdk_ec2~=0.12.0"]
ecs = ["aws_sdk_ecs~=0.12.0"]
guardduty = ["aws_sdk_guardduty~=0.12.0"]
iam = ["aws_sdk_iam~=0.12.0"]
kinesis = ["aws_sdk_kinesis~=0.12.0"]
kms = ["aws_sdk_kms~=0.12.0"]
lambda = ["aws_sdk_lambda~=0.12.0"]
lex_runtime_v2 = ["aws_sdk_lex_runtime_v2~=0.12.0"]
polly = ["aws_sdk_polly~=0.12.0"]
qbusiness = ["aws_sdk_qbusiness~=0.12.0"]
rds = ["aws_sdk_rds~=0.12.0"]
s3 = ["aws_sdk_s3~=0.12.0"]
sagemaker_runtime_http2 = ["aws_sdk_sagemaker_runtime_http2~=0.12.0"]
secrets_manager = ["aws_sdk_secrets_manager~=0.12.0"]
signin = ["aws_sdk_signin~=0.12.0"]
sns = ["aws_sdk_sns~=0.12.0"]
sqs = ["aws_sdk_sqs~=0.12.0"]
sts = ["aws_sdk_sts~=0.12.0"]
transcribe_streaming = ["aws_sdk_transcribe_streaming~=0.12.0"]

all = [
    "aws_sdk_python[acm]",
    "aws_sdk_python[api_gateway]",
    "aws_sdk_python[appconfigdata]",
    "aws_sdk_python[bedrock]",
    "aws_sdk_python[bedrock_agent]",
    "aws_sdk_python[bedrock_agent_runtime]",
    "aws_sdk_python[bedrock_agentcore]",
    "aws_sdk_python[bedrock_agentcore_control]",
    "aws_sdk_python[bedrock_data_automation]",
    "aws_sdk_python[bedrock_data_automation_runtime]",
    "aws_sdk_python[bedrock_runtime]",
    "aws_sdk_python[cloudformation]",
    "aws_sdk_python[cloudfront]",
    "aws_sdk_python[cloudfront_keyvaluestore]",
    "aws_sdk_python[cloudtrail]",
    "aws_sdk_python[cognito_identity]",
    "aws_sdk_python[connecthealth]",
    "aws_sdk_python[dynamodb]",
    "aws_sdk_python[ec2]",
    "aws_sdk_python[ecs]",
    "aws_sdk_python[guardduty]",
    "aws_sdk_python[iam]",
    "aws_sdk_python[kinesis]",
    "aws_sdk_python[kms]",
    "aws_sdk_python[lambda]",
    "aws_sdk_python[lex_runtime_v2]",
    "aws_sdk_python[polly]",
    "aws_sdk_python[qbusiness]",
    "aws_sdk_python[rds]",
    "aws_sdk_python[s3]",
    "aws_sdk_python[sagemaker_runtime_http2]",
    "aws_sdk_python[secrets_manager]",
    "aws_sdk_python[signin]",
    "aws_sdk_python[sns]",
    "aws_sdk_python[sqs]",
    "aws_sdk_python[sts]",
    "aws_sdk_python[transcribe_streaming]",
]

