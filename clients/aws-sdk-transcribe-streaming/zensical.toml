[project]
site_name = "AWS SDK for Python v4 - Transcribe Streaming"
site_description = "Documentation for AWS Transcribe Streaming Client"
site_author = "Amazon Web Services"

repo_name = "aws/aws-sdk-python"
repo_url = "https://github.com/aws/aws-sdk-python"

copyright = "&copy; 2026, Amazon Web Services, Inc. or its affiliates. All rights reserved."

exclude_docs = "README.md"

extra_css = ["stylesheets/extra.css"]

nav = [
    { Overview = "index.md" },
    { Client = "client/index.md" },
]

[project.theme]
language = "en"

features = [
    "content.code.copy",
    "navigation.indexes",
    "navigation.instant",
    "navigation.top",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.admonition]
[project.markdown_extensions.def_list]
[project.markdown_extensions.toc]
permalink = true
toc_depth = 3
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.snippets]
check_paths = true

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
show_signature = true
show_signature_annotations = true
show_root_heading = true
show_root_full_path = false
show_object_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
show_if_no_docstring = true
show_category_heading = true
group_by_category = true
separate_signature = true
signature_crossrefs = true
filters = [
    "!^_",
    "!^deserialize",
    "!^serialize",
]
