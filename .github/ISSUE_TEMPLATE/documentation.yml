---
name: "📕 Documentation Issue"
description: Report an issue in the API Reference documentation or Developer Guide
title: "(short issue description)"
labels: [documentation, needs-triage]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: A clear and concise description of the issue.
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: Links
      description: |
        Include links to affected documentation page(s).
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which documentation?
      description: Select all that apply.
      multiple: true
      options:
        - API Reference (https://docs.aws.amazon.com/sdk-for-python/v1/reference/)
        - README or CONTRIBUTING
        - docstrings in generated client code
        - other / not sure
    validations:
      required: true
