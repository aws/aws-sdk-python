[project]
name = "aws-credentials-sso"
dynamic = ["version"]
requires-python = ">=3.12"
authors = [
  {name = "Amazon Web Services"},
]
description = "IAM Identity Center (SSO) credentials support for the AWS SDK for Python v4."
readme = "README.md"
license = {text = "Apache License 2.0"}
keywords = ["aws", "credentials", "sso", "identity-center", "sdk", "smithy"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
"Code" = "https://github.com/aws/aws-sdk-python/tree/develop/packages/aws-credentials-sso/"
"Issue tracker" = "https://github.com/aws/aws-sdk-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/aws_credentials_sso/__init__.py"

[tool.hatch.build]
exclude = [
  "tests",
]

[tool.ruff]
src = ["src"]
